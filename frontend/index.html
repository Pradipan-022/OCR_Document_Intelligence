<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCR Document Intelligence - Platform</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Top Branding Header -->
    <header class="top-branding">
        <div class="brand-logo">
            <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="16" y1="13" x2="8" y2="13"></line>
                <line x1="16" y1="17" x2="8" y2="17"></line>
                <polyline points="10 9 9 9 8 9"></polyline>
            </svg>
            <span class="brand-name">OCR <span class="brand-accent">Document Intelligence</span></span>
        </div>
        <span class="version-badge">v1.0</span>

        <!-- App View Header Right Controls (Hidden in Auth View) -->
        <div id="header-user-controls" class="header-controls hidden">
            <span id="user-badge" class="user-badge"></span>
            <button id="logout-btn" class="btn-logout" title="Sign Out">Sign Out</button>
        </div>
    </header>

    <!-- Dynamic Animated Background -->
    <div class="bg-glow glow-1"></div>
    <div class="bg-glow glow-2"></div>
    <div class="bg-grid"></div>

    <!-- MAIN SPA VIEW WRAPPER -->
    <div id="spa-container">

        <!-- VIEW 1: AUTHENTICATION -->
        <section id="view-auth" class="spa-view active">
            <main class="auth-wrapper">
                <div class="auth-card">
                    <div class="auth-header">
                        <div class="header-icon-wrap">
                            <span class="auth-icon" id="form-icon">🔐</span>
                        </div>
                        <h2 id="form-title">Welcome Back</h2>
                        <p id="form-subtitle">Sign in to access document ingestion & quality workflows</p>
                    </div>

                    <div id="alert-message" class="alert hidden" aria-live="polite"></div>

                    <form id="auth-form">
                        <div class="form-group">
                            <label for="username">Username</label>
                            <div class="input-wrapper">
                                <input type="text" id="username" name="username" placeholder="Enter your username" required autocomplete="username">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="password">Password</label>
                            <div class="input-wrapper password-wrapper">
                                <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
                                <button type="button" id="toggle-password-btn" class="btn-eye" aria-label="Toggle password visibility">
                                    <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                        <circle cx="12" cy="12" r="3"></circle>
                                    </svg>
                                </button>
                            </div>
                        </div>

                        <button type="submit" id="submit-btn" class="btn-primary">
                            <span id="btn-text">Sign In</span>
                            <div class="spinner hidden" id="btn-spinner"></div>
                        </button>
                    </form>

                    <!-- Guest Mode Option with Tooltip Warning -->
                    <div class="guest-divider">
                        <span>OR</span>
                    </div>

                    <div class="guest-action-wrapper" data-tooltip="⚠️ Guest session history will not be saved across visits.">
                        <button type="button" id="guest-btn" class="btn-secondary">
                            <span>Continue as Guest</span>
                        </button>
                    </div>

                    <div class="auth-toggle">
                        <span id="toggle-prompt">Don't have an account?</span>
                        <button type="button" id="toggle-btn" class="btn-link">Register</button>
                    </div>
                </div>
            </main>
        </section>

        <!-- VIEW 2: APPLICATION CONTAINER (UPLOAD / WORKSPACE / DASHBOARD) -->
        <section id="view-app" class="spa-view hidden">
            <div class="app-container">
                <!-- Document Upload & Processing Views will render here dynamically -->
                <div id="app-content-root"></div>
            </div>
        </section>

    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
